<script>

(function () {
  var j = document.getElementById('jour'), h = document.getElementById('heure');
  var jours = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
  function p(n) { return n < 10 ? '0' + n : '' + n; }

/* Vagues rouges animées (fond XMB) */
(function () {
  var c = document.getElementById('vagues');
  if (!c || !c.getContext) return;

  var W, H, t = 0, dernier = 0;

    { a: 0.12, f: 1.1, v: 0.00026, p: 4.4, e: 0.08, o: 0.14, y: 0.66 },
    { a: 0.07, f: 2.2, v: 0.00045, p: 5.6, e: 0.04, o: 0.22, y: 0.60 }
  ];
  function taille() {
    var r = window.devicePixelRatio > 1.5 ? 1.5 : (window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    c.width = W * r; c.height = H * r;
    x.setTransform(r, 0, 0, r, 0, 0);
  }
  function dessiner(ms) {
    x.clearRect(0, 0, W, H);
    x.globalCompositeOperation = 'lighter';
    for (var i = 0; i < rubans.length; i++) {
      var r = rubans[i], pas = 10, n, k, xx, y1, y2, ph;
      var g = x.createLinearGradient(0, 0, W, 0);
      g.addColorStop(0, 'rgba(120,0,15,0)');
      g.addColorStop(0.5, 'rgba(255,40,70,' + r.o + ')');
      g.addColorStop(1, 'rgba(120,0,15,0)');
      x.fillStyle = g;
      x.beginPath();
      for (xx = 0; xx <= W + pas; xx += pas) {
        ph = (xx / W) * Math.PI * 2 * r.f + ms * r.v + r.p;
        y1 = H * r.y + Math.sin(ph) * H * r.a + Math.sin(ph * 0.5 + r.p) * H * 0.03;
        if (xx === 0) x.moveTo(xx, y1); else x.lineTo(xx, y1);
      }
      for (xx = W + pas; xx >= 0; xx -= pas) {
        ph = (xx / W) * Math.PI * 2 * r.f + ms * r.v + r.p + 0.55;
        y2 = H * r.y + Math.sin(ph) * H * r.a * 1.1 + H * r.e;
        x.lineTo(xx, y2);
      }
      x.closePath();
      x.fill();
    }
    x.globalCompositeOperation = 'source-over';
  }
  function boucle(ms) {
    if (ms - dernier > 33) { dessiner(ms); dernier = ms; }
    window.requestAnimationFrame(boucle);
  }
  taille();
  window.addEventListener('resize', function () { taille(); dessiner(t); });
  if (calmes) { dessiner(4000); } else { window.requestAnimationFrame(boucle); }
})();
